<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RTO Sales Dashboard</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2230;--mute:#6b7385;--line:#e3e6ec;--acc:#1f4fd8;--up:#17803d;--down:#c0392b;--head:#eef1f7}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#e8ebf2;--mute:#9aa3b5;--line:#2a3140;--acc:#6f95ff;--up:#4cc27a;--down:#ff7b6b;--head:#222938}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:18px;margin:0}
.sub{color:var(--mute);font-size:12px}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}
#drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--mute);cursor:pointer}
#drop.over{border-color:var(--acc);background:var(--head)}
#msg{margin-top:8px;font-size:13px}
#msg .ok{color:var(--up)}#msg .err{color:var(--down)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .l{color:var(--mute);font-size:12px}.kpi .v{font-size:28px;font-weight:700;margin-top:2px}
.kpi .d{font-size:12px;margin-top:2px}
.up{color:var(--up)}.down{color:var(--down)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{background:var(--head);font-weight:600;position:sticky;top:0}
tfoot td{font-weight:700;background:var(--head)}
.scroll{overflow:auto;max-height:420px}
.chartbox{position:relative;height:380px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
select{padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:2px;font-size:12px}
.chip button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:14px;padding:0}
.empty{padding:40px;text-align:center;color:var(--mute)}
.scope{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.scope select{font-size:15px;font-weight:600;padding:8px 10px;min-width:260px;max-width:100%}
.sect{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:20px 0 10px}
.tag{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px}
a.dl{color:var(--acc);cursor:pointer;text-decoration:none}a.dl:hover{text-decoration:underline}
th.l,td.l{text-align:left}
</style>
</head>
<body>
<header>
  <div>
    <h1>RTO Sales Dashboard</h1>
    <div class="sub" id="asof">No data loaded</div>
  </div>
  <div class="actions">
    <button class="btn" id="dlReport" disabled>⬇ Download report (.xlsx)</button>
    <span class="sub" id="who"></span><button class="btn ghost" id="signin">Sign in</button><button class="btn ghost" id="signout" hidden>Sign out</button>
  </div>
</header>
<main>
  <div class="card scope" id="scopeBar"><label for="scope"><b>View sales for</b></label>
    <select id="scope"><option value="ALL">Kerala – all RTOs</option></select>
    <span class="sub">Pick a main RTO to see it together with its SRTOs.</span></div>
  <div class="card" id="login" hidden style="max-width:380px;margin:16px auto">
    <h2>Sign in</h2>
    <form id="loginForm">
      <label class="sub">Email</label><br><input id="email" type="email" required autocomplete="username" style="width:100%;padding:8px;margin:4px 0 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)"><br>
      <label class="sub">Password</label><br><input id="pass" type="password" required autocomplete="current-password" style="width:100%;padding:8px;margin:4px 0 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)"><br>
      <button class="btn" type="submit" id="loginBtn">Sign in</button> <button class="btn ghost" type="button" id="loginCancel">Cancel</button>
      <div id="loginMsg" class="err" style="margin-top:10px;color:var(--down)"></div>
    </form>
  </div>

  <div id="app">
    <div class="card" id="uploadCard" hidden>
      <h2>Upload latest files</h2>
      <div id="drop">Drop RTO report files here (single-RTO files, or a combined workbook with one sheet per RTO), or click to choose
        <input type="file" id="file" accept=".xlsx,.xls,.csv" multiple hidden>
      </div>
      <div id="msg"></div>
    </div>
    <div class="sub" style="margin:0 0 12px">Loaded RTOs: <span id="chips"></span></div>
    <div id="hist"></div>
    <h2 class="sect" id="liveHead"></h2>
    <div id="dash"></div>
  </div>
</main>

<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/chart.umd.js"></script>
<script src="vendor/supabase.js"></script>
<script>
const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const MFULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const SB_URL='https://vjjvrnpmfwjxkkrltefh.supabase.co';
const SB_KEY='sb_publishable_VzVuDeRk6repPp8Qj1LZKw_IaebK0z5'; // publishable key: safe in browser code; access is enforced by database rules
const sb=supabase.createClient(SB_URL,SB_KEY);
let canUpload=false, user=null, H=null, scope='ALL', topNh=5, chartH=null;
let db={rtos:{}}, chart=null, topN=5;

const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString('en-IN');
const clean=s=>String(s==null?'':s).replace(/ /g,' ').trim();
const num=v=>{const n=parseInt(String(v==null?'':v).replace(/[^\d-]/g,''),10);return isNaN(n)?0:n};
const short=n=>n.replace(/\(UNIT OF EICHER LTD\)/,'').replace(/\(IMPORTER:.*\)/,'(Imp.)').replace(/\(P\)/,'')
  .replace(/\b(PVT|PRIVATE|LTD|LIMITED|COMPANY|INDIA)\b\.?/g,'').replace(/\s+/g,' ').trim()
  .toLowerCase().replace(/(^|[\s-])\w/g,c=>c.toUpperCase()).replace(/\b(Tvs|Bmw|Ola|Klb|Rgm)\b/g,m=>m.toUpperCase());

/* ---------- parse reports (any layout: several sheets, several dated tables per sheet) ---------- */
const TITLE_RE=/of\s+(.+?)\s*-\s*(KL\d+)\s*,.*?\((\d{4})\)/i;
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function cellDate(c){
  if(c instanceof Date&&!isNaN(c)) return ymd(new Date(c.getTime()+12*3600e3)); // +12h: SheetJS can land a few seconds before midnight
  if(typeof c==='string'){const m=c.trim().match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
    if(m){let y=+m[3];if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);if(d.getMonth()===+m[2]-1)return ymd(d);}}
  return null;
}
// returns every table found in one sheet: {name,code,year,asof,makers,order}
function parseSheetBlocks(rows){
  const hdrs=[];
  rows.forEach((r,i)=>{if(r.some(c=>clean(c).toUpperCase()==='JAN'))hdrs.push(i)});
  const blocks=[];let prev=-1;
  hdrs.forEach(h=>{
    let title=null,asof=null;
    for(let i=prev+1;i<h;i++)for(const c of rows[i]){
      const t=TITLE_RE.exec(clean(c));if(t)title=t;
      const d=cellDate(c);if(d&&(!asof||d>asof))asof=d;
    }
    prev=h;
    if(!title)return;
    const cols={};let first=1e9;
    rows[h].forEach((c,i)=>{const m=MONTHS.indexOf(clean(c).toUpperCase());if(m>=0){cols[m]=i;first=Math.min(first,i)}});
    const nameCol=first-1,snoCol=first-2;
    if(nameCol<0)return;
    const makers={};
    for(let i=h+1;i<rows.length;i++){
      const r=rows[i];
      if(r.some(c=>TITLE_RE.test(clean(c))||cellDate(c)))break;          // next table starts
      if(snoCol>=0&&clean(r[snoCol]).toLowerCase()==='s no')break;
      const name=clean(r[nameCol]);
      if(!name||!/^\d+$/.test(clean(r[snoCol]))||/^total/i.test(name))continue;
      makers[name]=MONTHS.map((_,m)=>cols[m]!=null?num(r[cols[m]]):0);
      prev=i;
    }
    if(Object.keys(makers).length)blocks.push({name:title[1].trim(),code:title[2].toUpperCase(),year:+title[3],asof,makers});
  });
  return blocks;
}
// parse a workbook -> best (latest-dated) table per RTO + notes about skipped ones
function parseWorkbook(wb){
  const all=[];let n=0;
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:true});
    parseSheetBlocks(rows).forEach(b=>all.push({...b,order:n++,sheet:sn}));
  }
  const best={},skipped={};
  for(const b of all){
    const cur=best[b.code];
    const newer=!cur||(b.asof||'')>(cur.asof||'')||((b.asof||'')===(cur.asof||'')&&b.order>cur.order);
    if(newer){if(cur)(skipped[b.code]=skipped[b.code]||[]).push(cur.asof);best[b.code]=b}
    else (skipped[b.code]=skipped[b.code]||[]).push(b.asof);
  }
  return {best,skipped};
}

/* ---------- storage (Supabase) ---------- */
async function loadFromDb(){
  const {data,error}=await sb.from('rto_reports').select('*');
  if(error)throw new Error(error.message);
  db={rtos:{}};
  for(const r of data)db.rtos[r.code]={name:r.name,code:r.code,year:r.year,asof:r.asof,uploaded:r.uploaded,makers:r.makers};
}

/* ---------- upload ---------- */
async function handleFiles(files){
  const out=[];
  try{await loadFromDb()}catch(e){$('msg').innerHTML=`<div class="err">Could not read current data: ${e.message}</div>`;return}
  const today=ymd(new Date()),dl=d=>d?new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'no date';
  for(const f of files){
    try{
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
      const {best,skipped}=parseWorkbook(wb);
      const codes=Object.keys(best);
      if(!codes.length)throw new Error('no RTO report table found');
      for(const code of codes){
        const p=best[code],asof=p.asof||today,ex=db.rtos[code];
        const note=(skipped[code]||[]).length?` <span class="sub">(older table${skipped[code].length>1?'s':''} ignored: ${skipped[code].map(dl).join(', ')})</span>`:'';
        if(ex&&ex.asof>asof){out.push(`<div class="err">– ${p.name} (${code}): file dated ${dl(asof)} is older than loaded data (${dl(ex.asof)}) – kept the newer data</div>`);continue}
        const row={code,name:p.name,year:p.year,asof,uploaded:new Date().toISOString(),makers:p.makers};
        const {error}=await sb.from('rto_reports').upsert(row,{onConflict:'code'});
        if(error){out.push(`<div class="err">✗ ${p.name} (${code}): ${error.message}</div>`);continue}
        db.rtos[code]=row;
        out.push(`<div class="ok">✓ ${p.name} (${code}) – data dated ${dl(asof)} – ${Object.keys(p.makers).length} manufacturers${note}</div>`);
      }
    }catch(e){out.push(`<div class="err">✗ ${f.name}: ${e.message}</div>`);}
  }
  $('msg').innerHTML=out.join('');
  render();
}

/* ---------- aggregation ---------- */
const allRtos=()=>Object.values(db.rtos).sort((a,b)=>a.code.localeCompare(b.code));
const codeDist=()=>H?Object.fromEntries(H.offices.map(o=>[o.c,o.d])):{};
const rtoList=()=>{const cd=codeDist();return allRtos().filter(r=>scope==='ALL'||cd[r.code]===scope)};
const latestAsof=()=>allRtos().map(r=>r.asof).sort().pop();
function refMonth(){
  const [y,m]=latestAsof().split('-').map(Number);
  return {year:y,cur:m-1};
}
// units by maker for month m  -> {maker:{code:units}}
function byMaker(m){
  const o={};
  for(const r of rtoList()) if(m>=0) for(const [mk,v] of Object.entries(r.makers)){(o[mk]=o[mk]||{})[r.code]=(v[m]||0);}
  return o;
}
const sumObj=o=>Object.values(o).reduce((a,b)=>a+b,0);
function monthTotals(m){
  const mk=byMaker(m),res={};
  for(const k in mk) res[k]=sumObj(mk[k]);
  return res;
}
function rtoMonth(m){const o={};for(const r of rtoList())o[r.code]=m<0?0:Object.values(r.makers).reduce((a,v)=>a+(v[m]||0),0);return o}
const pct=(a,b)=>b?((a-b)/b*100):null;
// compare daily averages so a part-month is comparable with a full month
function dayInfo(){const {year,cur}=refMonth();const last=new Date(year,cur+1,0).getDate();
  const asof=+latestAsof().slice(8);const dc=Math.min(asof,last);
  const dp=cur>0?new Date(year,cur,0).getDate():31;return {dc,dp}}
const rr=(a,b)=>{const {dc,dp}=dayInfo();return b?((a/dc)/(b/dp)-1)*100:null};
const delta=(a,b)=>{const p=rr(a,b);if(p==null)return '<span class="sub">–</span>';return `<span class="${p>=0?'up':'down'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}%</span>`};

/* ---------- render ---------- */
function render(){
  renderHist();
  const rs=rtoList(), all=allRtos();
  $('chips').innerHTML=all.map(r=>`<span class="chip">${r.name} (${r.code}) · ${new Date(r.asof+'T00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</span>`).join('')||'<span class="sub">none</span>';
  $('dlReport').disabled=!rs.length||!user;$('dlReport').title=user?'':'Sign in to download the report';
  $('liveHead').textContent=`2026 monthly data – ${scopeLabel()}`;
  if(all.length)$('asof').textContent=`2026 data as of ${new Date(latestAsof()+'T00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})} · ${all.length} RTO${all.length>1?'s':''} uploaded`;
  else $('asof').textContent='No 2026 monthly data loaded';
  if(!rs.length){$('dash').innerHTML=`<div class="empty">${all.length?`No 2026 monthly data has been uploaded for ${scopeLabel()} yet.`:`No 2026 monthly data yet.${canUpload?' Upload the RTO report files above.':' Ask an uploader to add the latest files.'}`}</div>`;return}
  const {year,cur}=refMonth(), prev=cur-1;
  const latest=new Date(latestAsof()+'T00:00');
  const curL=`${MFULL[cur]} ${year} (till date)`, prevL=prev>=0?`${MFULL[prev]} ${year}`:'–';
  const mc=monthTotals(cur), mp=monthTotals(prev), rc=rtoMonth(cur), rp=rtoMonth(prev);
  const tc=sumObj(mc), tp=sumObj(mp);
  const makers=[...new Set([...Object.keys(mc),...Object.keys(mp)])].sort((a,b)=>(mc[b]||0)-(mc[a]||0)||(mp[b]||0)-(mp[a]||0));
  const topC=makers[0], topR=Object.entries(rc).sort((a,b)=>b[1]-a[1])[0];
  const nameOf=c=>db.rtos[c].name;
  const bm=byMaker(cur), bk=Object.keys(bm).sort((a,b)=>sumObj(bm[b])-sumObj(bm[a]));
  const mxrHead=rs.map(r=>`<th title="${r.name} (${r.code})">${r.name.replace(/\s+S?RTO$/i,'')}</th>`).join('');
  const mxrRows=bk.map(k=>`<tr><td>${short(k)}</td>${rs.map(r=>`<td>${fmt(bm[k][r.code]||0)}</td>`).join('')}<td><b>${fmt(sumObj(bm[k]))}</b></td></tr>`).join('');
  const mxrFoot=`<tr><td>TOTAL</td>${rs.map(r=>`<td>${fmt(bk.reduce((a,k)=>a+(bm[k][r.code]||0),0))}</td>`).join('')}<td>${fmt(bk.reduce((a,k)=>a+sumObj(bm[k]),0))}</td></tr>`;

  const rtoRows=rs.map(r=>`<tr><td>${r.name}</td><td>${fmt(rc[r.code])}</td><td>${fmt(rp[r.code])}</td><td>${delta(rc[r.code],rp[r.code])}</td></tr>`).join('');
  const mkRows=makers.map(k=>`<tr><td>${short(k)}</td><td>${fmt(mc[k]||0)}</td><td>${fmt(mp[k]||0)}</td><td>${delta(mc[k]||0,mp[k]||0)}</td></tr>`).join('');

  $('dash').innerHTML=`
  <div class="kpis">
    <div class="kpi"><div class="l">${curL}</div><div class="v">${fmt(tc)}</div><div class="d sub">registrations, all RTOs</div></div>
    <div class="kpi"><div class="l">${prevL}</div><div class="v">${fmt(tp)}</div><div class="d">${delta(tc,tp)} <span class="sub">daily average vs previous month</span></div></div>
    <div class="kpi"><div class="l">Top maker (${MONTHS[cur]})</div><div class="v" style="font-size:20px">${topC?short(topC):'–'}</div><div class="d sub">${topC?fmt(mc[topC])+' units · '+(tc?(mc[topC]/tc*100).toFixed(1):0)+'%':''}</div></div>
    <div class="kpi"><div class="l">Top RTO (${MONTHS[cur]})</div><div class="v" style="font-size:20px">${topR?nameOf(topR[0]):'–'}</div><div class="d sub">${topR?fmt(topR[1])+' units':''}</div></div>
  </div>
  <div class="card">
    <h2>${MFULL[cur]} ${year} (till date) – manufacturer × RTO</h2>
    <div class="scroll" style="max-height:560px"><table id="mxr"><thead><tr><th>Manufacturer</th>${mxrHead}<th>Total</th></tr></thead><tbody>${mxrRows}</tbody><tfoot>${mxrFoot}</tfoot></table></div>
  </div>
  <div class="card">
    <h2>Top makers – monthly trend (${year})</h2>
    <div class="row"><label>Show top <select id="topN">${[3,5,8,10].map(n=>`<option ${n===topN?'selected':''}>${n}</option>`).join('')}</select> makers by year-to-date units</label>
    <span class="sub">Dashed segment = current month, still in progress.</span></div>
    <div class="chartbox"><canvas id="cv"></canvas></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Sales by RTO</h2><div class="scroll"><table>
      <thead><tr><th>RTO</th><th>${MONTHS[cur]} (MTD)</th><th>${prev>=0?MONTHS[prev]:'–'}</th><th title="Change in daily average vs previous month">Daily avg Δ</th></tr></thead>
      <tbody>${rtoRows}</tbody>
      <tfoot><tr><td>Total</td><td>${fmt(tc)}</td><td>${fmt(tp)}</td><td>${delta(tc,tp)}</td></tr></tfoot></table></div></div>
    <div class="card"><h2>Sales by manufacturer</h2><div class="scroll"><table>
      <thead><tr><th>Manufacturer</th><th>${MONTHS[cur]} (MTD)</th><th>${prev>=0?MONTHS[prev]:'–'}</th><th title="Change in daily average vs previous month">Daily avg Δ</th></tr></thead>
      <tbody>${mkRows}</tbody>
      <tfoot><tr><td>Total</td><td>${fmt(tc)}</td><td>${fmt(tp)}</td><td>${delta(tc,tp)}</td></tr></tfoot></table></div></div>
  </div>`;
  $('topN').onchange=e=>{topN=+e.target.value;drawChart()};
  drawChart();
}

const PAL=['#1f4fd8','#e8590c','#2f9e44','#9c36b5','#f08c00','#0c8599','#c2255c','#5c7cfa','#66a80f','#495057'];
function drawChart(){
  const {cur}=refMonth(); const rs=rtoList();
  const ytd={}; const monthly={};
  for(const r of rs) for(const [mk,v] of Object.entries(r.makers)){
    monthly[mk]=monthly[mk]||Array(12).fill(0);
    v.forEach((x,m)=>{monthly[mk][m]+=x}); }
  for(const mk in monthly) ytd[mk]=monthly[mk].slice(0,cur+1).reduce((a,b)=>a+b,0);
  const top=Object.keys(ytd).sort((a,b)=>ytd[b]-ytd[a]).slice(0,topN);
  const labels=MONTHS.slice(0,cur+1);
  const ds=top.map((mk,i)=>({label:short(mk),data:monthly[mk].slice(0,cur+1),borderColor:PAL[i%PAL.length],backgroundColor:PAL[i%PAL.length],tension:.25,pointRadius:3,borderWidth:2,
    segment:{borderDash:c=>c.p1DataIndex===cur?[6,5]:undefined}}));
  if(chart)chart.destroy();
  const dark=matchMedia('(prefers-color-scheme:dark)').matches, tick=dark?'#9aa3b5':'#6b7385', grid=dark?'#2a3140':'#e3e6ec';
  chart=new Chart($('cv'),{type:'line',data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{position:'bottom',labels:{color:tick,usePointStyle:true}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.parsed.y)}`}}},
    scales:{x:{ticks:{color:tick},grid:{color:grid}},y:{beginAtZero:true,ticks:{color:tick,callback:v=>fmt(v)},grid:{color:grid},title:{display:true,text:'Registrations',color:tick}}}}});
}


/* ---------- Kerala 2021-2025 history + view selector ---------- */
const slug=x=>x.toLowerCase().replace(/[^a-z]+/g,'');
const scopeLabel=()=>scope==='ALL'||!H?'Kerala':H.dmeta[scope].label;
const sumA=a=>a.reduce((x,y)=>x+y,0);
const pchg=(a,b)=>{const p=pct(a,b);return p==null?'<span class="sub">–</span>':`<span class="${p>=0?'up':'down'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}%</span>`};
async function loadHist(){
  try{const r=await fetch('data/kerala_2021_2025.json');if(!r.ok)throw new Error('HTTP '+r.status);H=await r.json()}
  catch(e){$('hist').innerHTML=`<div class="card empty">Could not load 2021–2025 data (${e.message}).</div>`;return}
  H.districts=[...new Set(H.offices.map(o=>o.d))].sort();H.dmeta={};
  for(const d of H.districts){
    const rt=H.offices.filter(o=>o.d===d&&o.t==='RTO').sort((a,b)=>a.c.localeCompare(b.c));
    H.dmeta[d]={label:rt.length>1?`${d} (incl. ${rt.slice(1).map(o=>o.n).join(', ')})`:d};
  }
  $('scope').innerHTML='<option value="ALL">Kerala – all RTOs</option>'+H.districts.map(d=>`<option value="${d}">${H.dmeta[d].label}</option>`).join('');
  const hit=H.districts.find(d=>slug(d)===slug(decodeURIComponent(location.hash.slice(1))));
  scope=hit||'ALL';$('scope').value=scope;
  render();
}
function pickScope(d){
  scope=d;$('scope').value=d;
  history.replaceState(null,'',d==='ALL'?location.pathname+location.search:'#'+slug(d));
  render();window.scrollTo({top:0,behavior:'smooth'});
}
$('scope').onchange=e=>pickScope(e.target.value);
window.addEventListener('hashchange',()=>{if(!H)return;const d=H.districts.find(x=>slug(x)===slug(decodeURIComponent(location.hash.slice(1))));const t=d||'ALL';if(t!==scope){scope=t;$('scope').value=t;render()}});
function liveYtd(code){const r=db.rtos[code];return r?sumA(Object.values(r.makers).map(sumA)):null}
function histData(){
  const offs=H.offices.filter(o=>scope==='ALL'||o.d===scope), n=H.years.length;
  const tot=Array(n).fill(0), mk={};
  const offT=o=>H.years.map((_,i)=>Object.values(o.m).reduce((a,v)=>a+v[i],0));
  offs.forEach(o=>{for(const [ix,v] of Object.entries(o.m)){const k=H.makers[+ix];const a=mk[k]=mk[k]||Array(n).fill(0);v.forEach((x,i)=>{a[i]+=x;tot[i]+=x})}});
  const mkeys=Object.keys(mk).sort((a,b)=>sumA(mk[b])-sumA(mk[a]));
  return {offs,tot,mk,mkeys,offT,n};
}
function renderHist(){
  if(!H)return;
  const {offs,tot,mk,mkeys,offT,n}=histData(), L=n-1, ys=H.years;
  const topL=[...mkeys].sort((a,b)=>mk[b][L]-mk[a][L])[0];
  const liveN=offs.filter(o=>liveYtd(o.c)!=null).length;
  const liveDate=liveN?new Date(latestAsof()+'T00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short'}):'';
  let table;
  if(scope==='ALL'){
    const rows=H.districts.map(d=>{const os=H.offices.filter(o=>o.d===d);const t=ys.map((_,i)=>sumA(os.map(o=>offT(o)[i])));
      const lv=os.map(o=>liveYtd(o.c));return {d,os,t,live:lv.every(x=>x!=null)?sumA(lv):null,partial:lv.some(x=>x!=null)&&!lv.every(x=>x!=null)}});
    rows.sort((a,b)=>b.t[L]-a.t[L]);
    table=`<table><thead><tr><th class="l">Main RTO / district</th><th>Offices</th>${ys.map(y=>`<th>${y}</th>`).join('')}<th>${ys[L]} vs ${ys[L-1]}</th><th title="2026 year to date, only where monthly data is uploaded">2026 YTD</th></tr></thead><tbody>`+
      rows.map(r=>`<tr><td class="l"><a class="dl" onclick="pickScope('${r.d}')">${H.dmeta[r.d].label}</a></td><td>${r.os.length}</td>${r.t.map(x=>`<td>${fmt(x)}</td>`).join('')}<td>${pchg(r.t[L],r.t[L-1])}</td><td>${r.live!=null?fmt(r.live):r.partial?'partial':'<span class="sub">–</span>'}</td></tr>`).join('')+
      `</tbody><tfoot><tr><td class="l">Kerala total</td><td>${offs.length}</td>${tot.map(x=>`<td>${fmt(x)}</td>`).join('')}<td>${pchg(tot[L],tot[L-1])}</td><td></td></tr></tfoot></table>`;
  }else{
    const rt=offs.filter(o=>o.t==='RTO').sort((a,b)=>a.c.localeCompare(b.c));
    const sr=offs.filter(o=>o.t==='SRTO').sort((a,b)=>offT(b)[L]-offT(a)[L]);
    const row=o=>{const t=offT(o),lv=liveYtd(o.c);return `<tr><td class="l">${o.n}<span class="tag">${o.t}</span> <span class="sub">${o.c}</span></td>${t.map(x=>`<td>${fmt(x)}</td>`).join('')}<td>${pchg(t[L],t[L-1])}</td><td>${lv!=null?fmt(lv):'<span class="sub">–</span>'}</td></tr>`};
    const lvAll=offs.map(o=>liveYtd(o.c));
    table=`<table><thead><tr><th class="l">Office</th>${ys.map(y=>`<th>${y}</th>`).join('')}<th>${ys[L]} vs ${ys[L-1]}</th><th title="2026 year to date, only where monthly data is uploaded">2026 YTD</th></tr></thead><tbody>${[...rt,...sr].map(row).join('')}</tbody>
      <tfoot><tr><td class="l">${scopeLabel()} – total</td>${tot.map(x=>`<td>${fmt(x)}</td>`).join('')}<td>${pchg(tot[L],tot[L-1])}</td><td>${lvAll.every(x=>x!=null)?fmt(sumA(lvAll)):'<span class="sub">–</span>'}</td></tr></tfoot></table>`;
  }
  const mrows=mkeys.map(k=>`<tr><td class="l">${short(k)}</td>${mk[k].map(x=>`<td>${fmt(x)}</td>`).join('')}<td>${pchg(mk[k][L],mk[k][L-1])}</td><td><b>${fmt(sumA(mk[k]))}</b></td></tr>`).join('');
  if(chartH){chartH.destroy();chartH=null}
  $('hist').innerHTML=`
  <div class="row" style="justify-content:space-between"><h2 class="sect" style="margin:0">${ys[0]}–${ys[L]} sales – ${scopeLabel()}</h2>
    <button class="btn ghost" id="dlHist" ${user?'':'disabled'} title="${user?'':'Sign in to download'}">⬇ Download this view (.xlsx)</button></div>
  <div class="kpis" style="margin-top:10px">
    <div class="kpi"><div class="l">${ys[L]} total</div><div class="v">${fmt(tot[L])}</div><div class="d">${pchg(tot[L],tot[L-1])} <span class="sub">vs ${ys[L-1]} (${fmt(tot[L-1])})</span></div></div>
    <div class="kpi"><div class="l">${ys[0]}–${ys[L]} total</div><div class="v">${fmt(sumA(tot))}</div><div class="d sub">${offs.length} office${offs.length>1?'s':''}</div></div>
    <div class="kpi"><div class="l">Top maker ${ys[L]}</div><div class="v" style="font-size:20px">${topL?short(topL):'–'}</div><div class="d sub">${topL?fmt(mk[topL][L])+' units · '+(tot[L]?(mk[topL][L]/tot[L]*100).toFixed(1):0)+'%':''}</div></div>
    <div class="kpi"><div class="l">Best year</div><div class="v">${ys[tot.indexOf(Math.max(...tot))]}</div><div class="d sub">${fmt(Math.max(...tot))} units</div></div>
  </div>
  <div class="card"><h2>${scope==='ALL'?'Sales by main RTO (district) – click a name to open it':'Sales by office – main RTO first, then its SRTOs'}</h2><div class="scroll" style="max-height:600px">${table}</div>
    <div class="sub" style="margin-top:6px">${liveN?`2026 YTD is shown only where monthly data is uploaded (${liveN} of ${offs.length} offices, as of ${liveDate}); it is a part-year figure.`:'2026 monthly data has not been uploaded for these offices.'}</div></div>
  <div class="grid2">
    <div class="card"><h2>Top makers – yearly trend</h2>
      <div class="row"><label>Show top <select id="topNh">${[3,5,8,10].map(x=>`<option ${x===topNh?'selected':''}>${x}</option>`).join('')}</select></label></div>
      <div class="chartbox" style="height:320px"><canvas id="cvh"></canvas></div></div>
    <div class="card"><h2>Sales by manufacturer</h2><div class="scroll" style="max-height:370px"><table>
      <thead><tr><th class="l">Manufacturer</th>${ys.map(y=>`<th>${y}</th>`).join('')}<th>${ys[L]} vs ${ys[L-1]}</th><th>Total</th></tr></thead><tbody>${mrows}</tbody></table></div></div>
  </div>`;
  $('topNh').onchange=e=>{topNh=+e.target.value;drawHistChart()};
  $('dlHist').onclick=downloadHist;
  drawHistChart();
}
function drawHistChart(){
  const {mk,mkeys}=histData(), ys=H.years;
  const dark=matchMedia('(prefers-color-scheme:dark)').matches, tick=dark?'#9aa3b5':'#6b7385', grid=dark?'#2a3140':'#e3e6ec';
  if(chartH)chartH.destroy();
  chartH=new Chart($('cvh'),{type:'line',data:{labels:ys,datasets:mkeys.slice(0,topNh).map((k,i)=>({label:short(k),data:mk[k],borderColor:PAL[i%PAL.length],backgroundColor:PAL[i%PAL.length],tension:.25,pointRadius:3,borderWidth:2}))},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom',labels:{color:tick,usePointStyle:true}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.parsed.y)}`}}},
      scales:{x:{ticks:{color:tick},grid:{color:grid}},y:{beginAtZero:true,ticks:{color:tick,callback:v=>fmt(v)},grid:{color:grid},title:{display:true,text:'Registrations',color:tick}}}}});
}
function downloadHist(){
  if(!user||!H)return;
  const {offs,tot,mk,mkeys,offT}=histData(), ys=H.years, wb=XLSX.utils.book_new();
  const add=(name,aoa,w)=>{const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name)};
  const o=[[`${ys[0]}–${ys[ys.length-1]} sales – ${scopeLabel()}`],[],['Code','Office','Type','District',...ys,'Total']];
  [...offs].sort((a,b)=>a.d.localeCompare(b.d)||(a.t===b.t?a.c.localeCompare(b.c):a.t==='RTO'?-1:1)).forEach(x=>{const t=offT(x);o.push([x.c,x.n,x.t,x.d,...t,sumA(t)])});
  o.push(['','TOTAL','','',...tot,sumA(tot)]);add('Offices',o,[8,24,7,20,...ys.map(()=>10),12]);
  const m=[[`Manufacturers – ${scopeLabel()}`],[],['Manufacturer',...ys,'Total']];
  mkeys.forEach(k=>m.push([k,...mk[k],sumA(mk[k])]));m.push(['TOTAL',...tot,sumA(tot)]);add('Manufacturers',m,[46,...ys.map(()=>10),12]);
  if(scope==='ALL'){const d=[['Main RTO / district','Offices',...ys,'Total']];
    H.districts.forEach(x=>{const os=H.offices.filter(q=>q.d===x),t=ys.map((_,i)=>sumA(os.map(q=>offT(q)[i])));d.push([x,os.length,...t,sumA(t)])});add('Districts',d,[24,9,...ys.map(()=>10),12])}
  const dd=new Date(),p=n=>String(n).padStart(2,'0');
  XLSX.writeFile(wb,`Kerala_Sales_${scope==='ALL'?'Kerala':slug(scope)}_${ys[0]}-${ys[ys.length-1]}_${dd.getFullYear()}${p(dd.getMonth()+1)}${p(dd.getDate())}.xlsx`);
}

/* ---------- report download ---------- */
function downloadReport(){
  if(!user)return;
  const {year,cur}=refMonth(),prev=cur-1,rs=rtoList();
  const wb=XLSX.utils.book_new();
  const add=(name,aoa,w)=>{const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name)};
  const mc=monthTotals(cur),mp=monthTotals(prev);
  const makers=[...new Set([...Object.keys(mc),...Object.keys(mp)])].sort((a,b)=>(mc[b]||0)-(mc[a]||0));
  // summary
  const sum=[[`RTO sales report – ${MFULL[cur]} ${year} (till date) vs ${prev>=0?MFULL[prev]:'-'}`],[`Generated ${new Date().toLocaleString('en-IN')}`],[],
    ['Manufacturer',`${MONTHS[cur]} (MTD)`,prev>=0?MONTHS[prev]:'-','Daily avg change %']];
  makers.forEach(k=>{const a=mc[k]||0,b=mp[k]||0;sum.push([k,a,b,b?+rr(a,b).toFixed(1):'']);});
  const ta=sumObj(mc),tb=sumObj(mp);sum.push(['TOTAL',ta,tb,tb?+rr(ta,tb).toFixed(1):'']);
  sum.push([],['RTO',`${MONTHS[cur]} (MTD)`,prev>=0?MONTHS[prev]:'-','Daily avg change %']);
  const rc=rtoMonth(cur),rp=rtoMonth(prev);
  rs.forEach(r=>sum.push([`${r.name} (${r.code})`,rc[r.code],rp[r.code],rp[r.code]?+rr(rc[r.code],rp[r.code]).toFixed(1):'']));
  sum.push(['TOTAL',ta,tb,tb?+rr(ta,tb).toFixed(1):'']);
  add('Summary',sum,[48,16,14,12]);
  // maker x rto
  const mxr=(m,label)=>{
    const bm=byMaker(m);const ks=Object.keys(bm).sort((a,b)=>sumObj(bm[b])-sumObj(bm[a]));
    const aoa=[[`Manufacturer x RTO – ${label}`],[],['Manufacturer',...rs.map(r=>`${r.name} (${r.code})`),'Total']];
    ks.forEach(k=>aoa.push([k,...rs.map(r=>bm[k][r.code]||0),sumObj(bm[k])]));
    aoa.push(['TOTAL',...rs.map(r=>ks.reduce((a,k)=>a+(bm[k][r.code]||0),0)),ks.reduce((a,k)=>a+sumObj(bm[k]),0)]);
    return aoa};
  const w=[48,...rs.map(()=>20),12];
  add(`${MONTHS[cur]} MTD`,mxr(cur,`${MFULL[cur]} ${year} (till date)`),w);
  if(prev>=0)add(MONTHS[prev],mxr(prev,`${MFULL[prev]} ${year}`),w);
  // YTD maker x rto
  const ytd={};rs.forEach(r=>Object.entries(r.makers).forEach(([k,v])=>{(ytd[k]=ytd[k]||{})[r.code]=v.slice(0,cur+1).reduce((a,b)=>a+b,0)}));
  const yk=Object.keys(ytd).sort((a,b)=>sumObj(ytd[b])-sumObj(ytd[a]));
  const ya=[[`Manufacturer x RTO – Year to date ${year}`],[],['Manufacturer',...rs.map(r=>`${r.name} (${r.code})`),'Total']];
  yk.forEach(k=>ya.push([k,...rs.map(r=>ytd[k][r.code]||0),sumObj(ytd[k])]));
  ya.push(['TOTAL',...rs.map(r=>yk.reduce((a,k)=>a+(ytd[k][r.code]||0),0)),yk.reduce((a,k)=>a+sumObj(ytd[k]),0)]);
  add('YTD',ya,w);
  // monthly by maker
  const mm=[[`Month-wise by manufacturer – all RTOs, ${year}`],[],['Manufacturer',...MONTHS.slice(0,cur+1),'Total']];
  yk.forEach(k=>{const row=Array(cur+1).fill(0);rs.forEach(r=>{const v=r.makers[k];if(v)for(let m=0;m<=cur;m++)row[m]+=v[m]});mm.push([k,...row,row.reduce((a,b)=>a+b,0)])});
  add('Monthly by maker',mm,[48,...Array(cur+2).fill(9)]);
  // monthly by rto
  const rm=[[`Month-wise by RTO, ${year}`],[],['RTO',...MONTHS.slice(0,cur+1),'Total']];
  rs.forEach(r=>{const row=MONTHS.slice(0,cur+1).map((_,m)=>Object.values(r.makers).reduce((a,v)=>a+(v[m]||0),0));rm.push([`${r.name} (${r.code})`,...row,row.reduce((a,b)=>a+b,0)])});
  add('Monthly by RTO',rm,[30,...Array(cur+2).fill(9)]);
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  XLSX.writeFile(wb,`RTO_Sales_Report_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.xlsx`);
}

/* ---------- wire up ---------- */
const drop=$('drop'),fi=$('file');
drop.onclick=()=>fi.click();
fi.onchange=()=>{handleFiles([...fi.files]);fi.value=''};
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',ev=>handleFiles([...ev.dataTransfer.files]));
$('dlReport').onclick=downloadReport;

/* ---------- sign-in (optional: needed only to download / upload) ---------- */
function setUser(session){
  user=session?session.user:null;
  $('signin').hidden=!!user;$('signout').hidden=!user;
  $('who').textContent=user?user.email:'';
  if(user)$('login').hidden=true;
}
async function refresh(){
  try{
    if(user){
      const {data,error}=await sb.from('uploaders').select('user_id').eq('user_id',user.id);
      canUpload=!error&&data.length>0;
    }else canUpload=false;
    $('uploadCard').hidden=!canUpload;
    await loadFromDb();
  }catch(e){$('dash').innerHTML=`<div class="empty err">Could not load data: ${e.message}</div>`;return}
  render();
}
$('signin').onclick=()=>{$('login').hidden=false;$('email').focus()};
$('loginCancel').onclick=()=>{$('login').hidden=true;$('loginMsg').textContent=''};
$('loginForm').onsubmit=async ev=>{
  ev.preventDefault();$('loginBtn').disabled=true;$('loginMsg').textContent='';
  const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});
  $('loginBtn').disabled=false;
  if(error){$('loginMsg').textContent=error.message;return}
  $('pass').value='';setUser(data.session);refresh();
};
$('signout').onclick=async()=>{await sb.auth.signOut();setUser(null);refresh()};
loadHist();
(async()=>{
  const {data}=await sb.auth.getSession();
  setUser(data.session);refresh();
})();
</script>
